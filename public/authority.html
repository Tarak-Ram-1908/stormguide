<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StormGuide — Control room</title>
  <meta name="theme-color" content="#0c264a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/authority.css">
</head>
<body class="authority">
  <header class="topbar">
    <div class="brand"><img src="/icons/icon-192.png" alt="" width="28" height="28"><span>StormGuide · Control room</span></div>
    <div class="net-pill" id="net-pill"><span class="dot"></span><span id="net-text">…</span></div>
    <a class="lang-btn" href="/" target="_blank" rel="noopener">Traveller app ↗</a>
    <button class="lang-btn" id="logout" type="button" hidden>Log out</button>
  </header>

  <div id="login" class="login card">
    <h2>Control room login</h2>
    <p class="muted small">For disaster-management officials. Demo PIN: <strong>2026</strong> (set <code>AUTHORITY_PIN</code> in production).</p>
    <form id="login-form">
      <input class="input" id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required maxlength="32">
      <button class="btn primary block" type="submit">Log in</button>
    </form>
    <div id="login-error" class="warn-text"></div>
  </div>

  <div id="app" class="console" hidden>
    <div class="stats" id="stats"></div>
    <div class="console-grid">
      <div class="map-col">
        <div id="map" class="map admin-map"></div>
        <div id="drawbar" class="drawbar" hidden></div>
      </div>
      <div class="panel-col">
        <nav class="ptabs" id="ptabs">
          <button data-p="sos" class="active">🆘 SOS <span id="sos-count" class="count"></span></button>
          <button data-p="reports">📣 Reports <span id="rep-count" class="count"></span></button>
          <button data-p="alert">📢 Publish alert</button>
          <button data-p="zones">🗺️ Zones &amp; roads</button>
          <button data-p="shelters">⛺ Shelters &amp; transport</button>
          <button data-p="rumors">🕵️ Rumors</button>
          <button data-p="sms">✉️ SMS gateway</button>
          <button data-p="sim">🎬 Simulation</button>
        </nav>
        <div id="panel" class="panel"></div>
      </div>
    </div>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/js/geo.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/i18n/en.js"></script>
  <script src="/js/i18n/ta.js"></script>
  <script src="/js/i18n/hi.js"></script>
  <script src="/js/i18n/fr.js"></script>
  <script src="/js/i18n/de.js"></script>
  <script src="/js/i18n/es.js"></script>
  <script src="/js/i18n/zh.js"></script>
  <script src="/js/i18n/ja.js"></script>
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/authority.js"></script>
</body>
</html>
